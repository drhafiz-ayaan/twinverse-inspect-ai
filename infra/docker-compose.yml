# TwinVerse Inspect AI — full stack
#
#   docker compose -f infra/docker-compose.yml up --build
#
# Dashboard  http://localhost:3000
# API docs   http://localhost:8000/docs
# MinIO      http://localhost:9001
#
# Credentials below are development defaults. Override every one of them via a
# .env file beside this compose file before deploying anywhere reachable — the
# API refuses to start on the default SECRET_KEY unless DEBUG is on.

name: twinverse

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: ${POSTGRES_DB:-twinverse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-twinverse}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ../backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-devpass}@postgres:5432/${POSTGRES_DB:-twinverse}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key-change-me}
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
    # Runs once and exits. The API waits on it completing successfully, so the
    # service can never come up against an unmigrated schema.
    restart: "no"

  api:
    build:
      context: ../backend
    environment:
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-devpass}@postgres:5432/${POSTGRES_DB:-twinverse}
      S3_ENDPOINT_URL: http://minio:9000
      # Download links are signed with this host instead, because the browser
      # is outside the Docker network and cannot resolve "minio".
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-twinverse-inspections}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY - generate with python -c "import secrets; print(secrets.token_urlsafe(48))"}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      MODEL_WEIGHTS: ${MODEL_WEIGHTS:-/weights/crack-hardneg.pt}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.10}
      # Severity bands are percentiles of a specific model's output, so they
      # change whenever the checkpoint does — see README D-018. Passed as
      # environment rather than left to the image's defaults so recalibrating
      # is a restart, not a rebuild. Values from ml/calibrate_bands.py.
      SEVERITY_BAND_MEDIUM: ${SEVERITY_BAND_MEDIUM:-0.0060}
      SEVERITY_BAND_HIGH: ${SEVERITY_BAND_HIGH:-0.0163}
      SEVERITY_BAND_CRITICAL: ${SEVERITY_BAND_CRITICAL:-0.1653}
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-cpu}
    ports:
      - "8000:8000"
    volumes:
      # Trained checkpoints are gitignored and not baked into the image.
      # Without this mount the service falls back to COCO weights, which
      # detect people and cars rather than defects.
      - ../ml/weights:/weights:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        # Baked in at build time, and correct for the *browser*: the API is
        # published on the host at this address.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      # The address the dashboard *server* uses, which is not the same one.
      # All data fetching and every proxy route in this app run server-side,
      # and inside this container "localhost" is the container itself — so
      # without this, signing in returns 502 while the page still renders 200.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
