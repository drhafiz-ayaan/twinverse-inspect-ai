name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # The suite runs against real Postgres and MinIO rather than mocks
    # (README D-010), so CI has to provide them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: twinverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OpenCV runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A real key reached .env.example once already and had to be scrubbed
      # from history. This fails the build rather than relying on remembering.
      - name: Reject committed secrets
        run: |
          set -uo pipefail
          fail=0

          # Credential-shaped assignments in tracked files. Obvious
          # placeholders are excluded — .env.example exists precisely to hold
          # them, and a check that fails on its own repository gets disabled
          # rather than fixed.
          hits=$(git grep -nIE \
            '^[A-Z_]*(SECRET|TOKEN|API_KEY|PASSWORD)=[A-Za-z0-9_/+-]{16,}' \
            -- '*.example' '*.yml' '*.yaml' '*.toml' '*.md' '*.env*' 2>/dev/null \
            | grep -vEi 'replace|change[-_]?me|your[-_]|example|placeholder|dev-only|insecure|xxx|TODO|\$\{' \
            || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a credential-shaped value looks committed in a tracked file"
            fail=1
          fi

          if git ls-files --error-unmatch backend/.env >/dev/null 2>&1; then
            echo "::error::backend/.env is tracked; it must stay gitignored"
            fail=1
          fi
          exit $fail
